<title>Charge Dock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:ROND,wght@100,400;100,700&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: StandBy-style night dock. Landscape = big clock left, swipeable tile page right. Portrait = clock on top, tiles below. */
  :root {
    --bg: #050506;
    --surface: #121214;
    --surface-2: #1b1b1e;
    --line: #26262a;
    --fg: #f4f3f0;
    --muted: #7a7980;
    --accent: #d71921;
      --font: "Space Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --dot: "Doto", "Space Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font);
    padding-block: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden; -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .dock { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 2vmin; padding-block: 2.4vmin; transition: opacity .6s; }
  .dock.dim { opacity: .3; }

  .status { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: clamp(12px, 2.3vmin, 18px); letter-spacing: .05em; }
  .charging { display: flex; align-items: center; gap: .6em; }
  .dot { width: .55em; height: .55em; border-radius: 50%; background: var(--accent); box-shadow: 0 0 .9em #d7192199; }

  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 3vmin; min-height: 0; transition: transform 2s; }
  @media (max-aspect-ratio: 1/1) { .stage { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); } }

  .tile.clock { justify-content: center; align-items: center; }
  .time { font-family: var(--dot); font-weight: 700; font-variation-settings: "ROND" 100; font-size: min(14.5vw, 32vh); line-height: 1; letter-spacing: -.035em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-aspect-ratio: 1/1) { .time { font-size: min(31vw, 22vh); } }
  .colon { color: var(--accent); animation: pulse 2s steps(1) infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .date { margin-top: 1.6vmin; color: var(--muted); font-size: clamp(12px, 2.6vmin, 22px); font-weight: 400; letter-spacing: .12em; text-transform: uppercase; }

  .tiles { position: relative; min-height: 0; }
  .page { height: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); gap: 1.6vmin; animation: in .35s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateX(14px); } }
  .tile { background: var(--surface); border-radius: clamp(18px, 3.4vmin, 30px); padding: clamp(12px, 2.4vmin, 22px); display: flex; flex-direction: column; justify-content: space-between; min-width: 0; min-height: 0; overflow: hidden; }
  .tile.wide { grid-column: span 2; }
  .label { display: flex; align-items: center; gap: .55em; color: var(--muted); font-size: clamp(10px, 1.9vmin, 14px); letter-spacing: .14em; text-transform: uppercase; }
  .label svg { width: 1.3em; height: 1.3em; flex: none; }
  .big { font-family: var(--dot); font-weight: 700; font-variation-settings: "ROND" 100; font-size: clamp(28px, 7.4vmin, 64px); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: clamp(12px, 2.3vmin, 17px); font-weight: 400; line-height: 1.4; }


  .ring { width: min(100%, 13vmin); aspect-ratio: 1; position: relative; flex: none; }
  @media (max-aspect-ratio: 1/1) { .ring { width: min(100%, 18vmin); } }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .track { stroke: var(--surface-2); }
  .ring .fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .8s; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--dot); font-weight: 700; font-variation-settings: "ROND" 100; font-size: clamp(10px, 2.7vmin, 24px); }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .week div { display: flex; flex-direction: column; align-items: center; gap: .35em; color: var(--muted); font-size: clamp(10px, 1.9vmin, 14px); letter-spacing: .08em; }
  .week b { font-family: var(--dot); font-variation-settings: "ROND" 100; font-weight: 700; font-size: clamp(16px, 4.4vmin, 34px); line-height: 1; color: var(--fg); opacity: .45; }
  .week .today { color: var(--accent); }
  .week .today b { color: var(--accent); opacity: 1; }
  .week .future b { opacity: 1; }
  .batt { display: flex; align-items: center; gap: 2vmin; }

  .bottom { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: clamp(11px, 2vmin, 14px); letter-spacing: .05em; }
  .pills { display: flex; gap: 8px; }
  .pill[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .tile.clock { cursor: pointer; }
  body.red { --bg: #060102; --surface: #150607; --surface-2: #220a0c; --line: #301012; --fg: #e8352f; --muted: #7e211f; --accent: #ff5a4d; }
  .pill { border: 1px solid var(--line); border-radius: 99px; padding: .5em 1em; color: var(--muted); }


  @media (prefers-reduced-motion: reduce) { .colon, .page { animation: none; } .stage { transition: none; } }
</style>

<div class="dock" id="dock">
  <div class="status">
    <div class="charging"><span class="dot"></span><span id="chg">Charging</span></div>
    <div id="clockTop">Bedroom</div>
  </div>

  <div class="stage" id="stage">
    <div class="clock tile">
      <div class="time" id="time" aria-live="off">00:00</div>
      <div class="date" id="date"></div>
    </div>

    <div class="tiles" id="tiles">
      <section class="page" id="page0">
        <div class="tile wide">
          <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="16" height="9" rx="2.5"/><path d="M21 11v3"/></svg>Battery</div>
          <div class="batt">
            <div class="ring">
              <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="40"/><circle class="fill" id="ringFill" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="45"/></svg>
              <b id="pct">82%</b>
            </div>
            <div><div class="big" id="battBig">Charging</div><div class="sub" id="battSub">Full in about 38 min</div></div>
          </div>
        </div>
        <div class="tile">
          <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>Weather · sample</div>
          <div><div class="big">18°</div><div class="sub">Clear · H 22° L 11°</div></div>
        </div>
        <div class="tile">
          <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Date</div>
          <div><div class="big" id="dayNum">00</div><div class="sub" id="dayName">&nbsp;</div></div>
        </div>
        <div class="tile wide">
          <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>This week</div>
          <div class="week" id="week"></div>
        </div>
      </section>
    </div>
  </div>

  <div class="bottom">
    <span id="dimNote">Dims 22:00–07:00</span>
    <div class="pills">
      <button class="pill" id="autoBtn" aria-pressed="true">Auto</button>
      <button class="pill" id="redBtn" aria-pressed="false">Night</button>
      <button class="pill" id="dimBtn">Dim</button>
    </div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');



  // ---- date + week strip (Monday first) ----
  let dayKey = '';
  function renderDate(n) {
    const key = n.toDateString(); if (key === dayKey) return; dayKey = key;
    $('dayNum').textContent = pad(n.getDate());
    $('dayName').textContent = n.toLocaleDateString(undefined, { weekday: 'long' });
    const mon = new Date(n); mon.setHours(12, 0, 0, 0); mon.setDate(n.getDate() - ((n.getDay() + 6) % 7));
    const letters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    $('week').innerHTML = letters.map((l, i) => {
      const d = new Date(mon); d.setDate(mon.getDate() + i);
      const cls = d.toDateString() === key ? 'today' : (d > n ? 'future' : 'past');
      return '<div class="' + cls + '"><span>' + l + '</span><b>' + pad(d.getDate()) + '</b></div>';
    }).join('');
  }

  // ---- clock ----
  function tick() {
    const n = new Date();
    $('time').innerHTML = pad(n.getHours()) + '<span class="colon">:</span>' + pad(n.getMinutes());
    renderDate(n);
    $('date').textContent = n.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }
  tick(); setInterval(tick, 1000);

  // ---- dimming (auto by time, manual override) and red night mode ----
  const NIGHT_START = 22, NIGHT_END = 7;
  let autoDim = true, red = false, manual = null, lastNight = null, dim = false;
  try { const p = JSON.parse(localStorage.getItem('charge-dock-prefs')); if (p) { autoDim = p.autoDim !== false; red = !!p.red; } } catch (e) {}
  const savePrefs = () => { try { localStorage.setItem('charge-dock-prefs', JSON.stringify({ autoDim, red })); } catch (e) {} };
  function applyDisplay() {
    const h = new Date().getHours(), night = h >= NIGHT_START || h < NIGHT_END;
    if (night !== lastNight) { lastNight = night; manual = null; }   // the schedule takes over again at each boundary
    dim = manual !== null ? manual : (autoDim && night);
    $('dock').classList.toggle('dim', dim);
    document.body.classList.toggle('red', red);
    $('dimBtn').textContent = dim ? 'Bright' : 'Dim';
    $('autoBtn').setAttribute('aria-pressed', String(autoDim));
    $('redBtn').setAttribute('aria-pressed', String(red));
    $('dimNote').textContent = autoDim ? 'Dims 22:00\u201307:00' : 'Auto-dim off';
  }
  $('dimBtn').onclick = () => { manual = !dim; applyDisplay(); };
  $('autoBtn').onclick = () => { autoDim = !autoDim; manual = null; savePrefs(); applyDisplay(); };
  const toggleRed = () => { red = !red; savePrefs(); applyDisplay(); };
  $('redBtn').onclick = toggleRed;
  document.querySelector('.tile.clock').onclick = toggleRed;
  applyDisplay(); setInterval(applyDisplay, 5000);

  // ---- battery (real on Android Chrome, sample elsewhere) ----
  function showBattery(level, charging, secs) {
    $('pct').textContent = Math.round(level * 100) + '%';
    $('ringFill').style.strokeDashoffset = String(251.3 * (1 - level));
    $('chg').textContent = (charging ? 'Charging · ' : 'On battery · ') + Math.round(level * 100) + '%';
    $('battBig').textContent = charging ? 'Charging' : 'Not charging';
    $('battSub').textContent = charging && isFinite(secs) && secs > 0 ? 'Full in about ' + Math.round(secs / 60) + ' min' : (charging ? 'Almost there' : 'Plug in to charge');
  }
  showBattery(0.82, true, 38 * 60);
  if (navigator.getBattery) navigator.getBattery().then(b => {
    const u = () => showBattery(b.level, b.charging, b.chargingTime);
    u(); ['levelchange', 'chargingchange', 'chargingtimechange'].forEach(ev => b.addEventListener(ev, u));
  }).catch(() => {});

  // ---- keep the screen on (when the browser allows it) ----
  async function keepAwake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }
  keepAwake(); document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

  // ---- burn-in protection: drift the layout a few pixels every 2 minutes ----
  setInterval(() => { $('stage').style.transform = 'translate(' + (Math.random() * 8 - 4).toFixed(1) + 'px,' + (Math.random() * 8 - 4).toFixed(1) + 'px)'; }, 120000);
</script>
