name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node --test "web/test/*.test.js"

  android:
    # The Android build only runs on main (a merge, or Run workflow on main), never on other branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: APK is signed with the committed debug key
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          key=$(keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey | grep -m1 'SHA-256' | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK signer SHA-256: $apk"
          echo "Keystore SHA-256:   $key"
          test -n "$apk" && test "$apk" = "$key"
      - name: APK contains the dock page
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk > apk-contents.txt
          grep -q 'assets/index.html' apk-contents.txt
          grep -q 'assets/dock-logic.js' apk-contents.txt
          grep -q 'assets/fonts/' apk-contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: charge-dock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
