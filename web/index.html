<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charge Dock</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Layout: StandBy-style night dock. Landscape = clock tile left, swipeable tile pages right. Portrait = clock on top, tiles below. */
  :root {
    --bg: #050506;
    --surface: #121214;
    --surface-2: #1b1b1e;
    --line: #26262a;
    --fg: #f4f3f0;
    --muted: #7a7980;
    --accent: #d71921;
    --on-accent: #ffffff;
    --font: "Space Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --dot: "Doto", "Space Mono", ui-monospace, monospace;
    --dot-weight: 700;
    --time-scale: 1;
    --h12-scale: 1;
    --dim-opacity: .3;
    color-scheme: dark;
  }
  :root[data-font="mono"] { --dot: "Space Mono", ui-monospace, "SF Mono", Menlo, monospace; --dot-weight: 400; --time-scale: .84; }
  :root[data-font="sans"] { --dot: system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif; --dot-weight: 200; --time-scale: .95; }
  :root[data-hour12="true"] { --h12-scale: .85; }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font);
    padding-block: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden; -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .dock { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 2vmin; padding-block: 2.4vmin; transition: opacity .6s; }
  .dock.dim { opacity: var(--dim-opacity); }

  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 3vmin; min-height: 0; transition: transform 2s; }
  @media (max-aspect-ratio: 1/1) { .stage { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); } }

  .tile.clock { justify-content: center; align-items: center; cursor: pointer; container-type: normal; }
  .time { font-family: var(--dot); font-weight: var(--dot-weight); font-variation-settings: "ROND" 100; font-size: calc(min(14.5vw, 32vh) * var(--time-scale) * var(--h12-scale)); line-height: 1; letter-spacing: -.035em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-aspect-ratio: 1/1) { .time { font-size: calc(min(31vw, 22vh) * var(--time-scale) * var(--h12-scale)); } }
  .colon { color: var(--accent); animation: pulse 2s steps(1) infinite; }
  .ampm { font-family: var(--font); font-weight: 400; font-size: .2em; letter-spacing: .05em; margin-left: .25em; color: var(--muted); }
  @keyframes pulse { 50% { opacity: .25; } }
  .date { margin-top: 1.6vmin; color: var(--muted); font-size: clamp(12px, 2.6vmin, 22px); font-weight: 400; letter-spacing: .12em; text-transform: uppercase; }

  .tiles { position: relative; min-height: 0; touch-action: pan-y; }
  .page { height: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); gap: 1.6vmin; animation: in .35s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateX(14px); } }
  .tile { background: var(--surface); border-radius: clamp(18px, 3.4vmin, 30px); padding: clamp(12px, 2.4vmin, 22px); display: flex; flex-direction: column; justify-content: space-between; min-width: 0; min-height: 0; overflow: hidden; container-type: size; }
  .tile.wide { grid-column: span 2; }
  .tile.tall { grid-row: span 2; }
  .label { display: flex; align-items: center; gap: .55em; color: var(--muted); font-size: clamp(10px, 1.9vmin, 14px); letter-spacing: .14em; text-transform: uppercase; }
  .label svg { width: 1.3em; height: 1.3em; flex: none; }
  .big { font-family: var(--dot); font-weight: var(--dot-weight); font-variation-settings: "ROND" 100; font-size: clamp(28px, 7.4vmin, 64px); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: clamp(12px, 2.3vmin, 17px); font-weight: 400; line-height: 1.4; }

  .ring { --ring: clamp(48px, min(38cqw, 66cqh), 220px); width: var(--ring); aspect-ratio: 1; position: relative; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .track { stroke: var(--surface-2); }
  .ring .fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .8s; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--dot); font-weight: var(--dot-weight); font-variation-settings: "ROND" 100; font-size: calc(var(--ring) * .24); }
  .batt { display: flex; align-items: center; gap: 4cqmin; min-width: 0; }

  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; }
  .week div { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: .35em; padding: 12% 0; border-radius: 14px; background: var(--surface-2); color: var(--muted); font-size: clamp(11px, 4cqw, 20px); letter-spacing: .08em; }
  .week b { font-family: var(--dot); font-variation-settings: "ROND" 100; font-weight: var(--dot-weight); font-size: clamp(18px, min(8.6cqw, 22cqh), 80px); line-height: 1; color: var(--fg); opacity: .45; }
  .week .wn { display: none; }
  .week .today { color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
  .week .today b { color: var(--accent); opacity: 1; }
  .week .future b { opacity: 1; }
  .tiles .tile.tall > .week { flex: 1; margin-block: 10px 0; grid-auto-rows: minmax(0, 1fr); }

  /* Right-hand tiles: the content scales with its tile and sits centred under the label. */
  .tiles .tile > :last-child { margin-block: auto; }
  .tiles .label { font-size: clamp(10px, 4.6cqmin, 16px); }
  .tiles .tile .big { font-size: clamp(26px, min(34cqh, 60cqw), 170px); }
  .tiles .tile .sub { font-size: clamp(12px, min(8cqh, 11cqw), 26px); }
  .tiles .batt .big { font-size: clamp(22px, min(20cqh, 9cqw), 80px); }
  .tiles .batt .sub { font-size: clamp(11px, min(8cqh, 4cqw), 20px); }
  @container (max-aspect-ratio: 1/1) {
    .tiles .tile.tall > .week { grid-template-columns: 1fr; }
    .week div { flex-direction: row; padding: 0 6cqw; font-size: clamp(12px, min(3.4cqh, 6cqw), 26px); }
    .week .wl { display: none; }
    .week .wn { display: inline; }
    .week b { font-size: clamp(22px, min(7cqh, 18cqw), 90px); }
  }
  @container (max-aspect-ratio: 3/2) {
    .batt { flex-direction: column; text-align: center; gap: 3cqmin; }
    .ring { --ring: clamp(64px, min(52cqw, 40cqh), 220px); }
    .tiles .batt .big { font-size: clamp(22px, min(11cqw, 13cqh), 80px); }
    .tiles .batt .sub { font-size: clamp(11px, min(5cqw, 6cqh), 22px); }
  }

  .bottom { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; color: var(--muted); font-size: clamp(11px, 2vmin, 14px); letter-spacing: .05em; }
  .dots { display: flex; gap: 10px; grid-column: 2; }
  .dots button { width: 9px; height: 9px; border-radius: 50%; background: var(--line); padding: 0; }
  .dots button[aria-current="true"] { background: var(--fg); }
  .pills { display: flex; gap: 8px; grid-column: 3; justify-self: end; }
  .pill { border: 1px solid var(--line); border-radius: 99px; padding: .5em 1em; color: var(--muted); }
  .pill[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .pill.icon { padding: .5em; display: grid; place-items: center; }
  .pill.icon svg { width: 1.5em; height: 1.5em; }

  /* ---- settings ---- */
  .settings { position: fixed; inset: 0; z-index: 20; background: rgba(5, 5, 6, .97); overflow-y: auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); -webkit-user-select: none; user-select: none; }
  .sheet { max-width: 760px; margin-inline: auto; padding-bottom: 24px; }
  .sheet header { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding-block: 14px 10px; background: rgba(5, 5, 6, .97); z-index: 1; }
  .sheet h2 { font-family: var(--font); font-weight: 400; font-size: clamp(14px, 3vmin, 20px); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  #settingsClose { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); font-size: 22px; line-height: 1; }
  .rows { display: grid; grid-template-columns: 1fr; gap: 8px 20px; }
  @media (min-aspect-ratio: 1/1) { .rows { grid-template-columns: 1fr 1fr; } }
  .row { background: var(--surface); border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
  .rl { color: var(--fg); font-size: 13px; letter-spacing: .04em; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .seg button { padding: .45em .9em; font-size: 12px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .swatches { display: flex; gap: 10px; }
  .swatches button { width: 26px; height: 26px; padding: 0; border-radius: 50%; background: var(--c); border: 2px solid transparent; }
  .swatches button[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--surface) inset; }
  #customSwatch { --c: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
  #customSwatch svg { width: 14px; height: 14px; }
  .row.custom { grid-column: 1 / -1; }
  .sliders { display: grid; gap: 10px; flex: 1; min-width: 0; }
  .sliders label { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .sliders input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 12px; border-radius: 99px; background: var(--track); margin: 0; }
  .sliders input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--muted); }
  .sliders input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--bg); }
  #hue { --track: linear-gradient(90deg, hsl(0 100% 50%), hsl(60 100% 50%), hsl(120 100% 50%), hsl(180 100% 50%), hsl(240 100% 50%), hsl(300 100% 50%), hsl(360 100% 50%)); }
  #sat { --track: linear-gradient(90deg, hsl(var(--h) 0% var(--lp)), hsl(var(--h) 100% var(--lp))); }
  #lig { --track: linear-gradient(90deg, #000, hsl(var(--h) var(--sp) 50%), #fff); }
  #customHex { width: 8.2em; padding: .55em .7em; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--fg); font: inherit; font-size: 13px; letter-spacing: .04em; -webkit-user-select: text; user-select: text; text-transform: lowercase; }
  #customHex:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #customHex[aria-invalid="true"] { border-color: #ff5a4d; }
  .step { display: flex; align-items: center; gap: 10px; }
  .step button { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); font-size: 18px; line-height: 1; }
  .step output { min-width: 3.6em; text-align: center; font-size: 13px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .switch { width: 46px; height: 28px; border-radius: 99px; background: var(--surface-2); position: relative; flex: none; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
  .switch[aria-checked="true"] { background: var(--line); }
  .switch[aria-checked="true"]::after { background: var(--accent); transform: translateX(18px); }
  #resetSettings { margin-top: 14px; padding: .6em 1.2em; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font-size: 12px; }

  body.red { --bg: #060102; --surface: #150607; --surface-2: #220a0c; --line: #301012; --fg: #e8352f; --muted: #7e211f; --accent: #ff5a4d; }
  @media (prefers-reduced-motion: reduce) { .colon, .page { animation: none; } .stage, .dock { transition: none; } }
</style>
</head>
<body>
<div class="dock" id="dock">
  <div class="stage" id="stage">
    <div class="clock tile">
      <div class="time" id="time" aria-live="off">00:00</div>
      <div class="date" id="date"></div>
    </div>

    <div class="tiles" id="tiles">
      <section class="page" id="page0">
        <div class="tile wide">
          <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="16" height="9" rx="2.5"/><path d="M21 11v3"/></svg>Battery</div>
          <div class="batt">
            <div class="ring">
              <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="40"/><circle class="fill" id="ringFill" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="251.3"/></svg>
              <b id="pct">--%</b>
            </div>
            <div><div class="big" id="battBig">Charging</div><div class="sub" id="battSub">Level unknown</div></div>
          </div>
        </div>
        <div class="tile">
          <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>Weather · sample</div>
          <div><div class="big">18°</div><div class="sub">Clear<br>H 22° · L 11°</div></div>
        </div>
        <div class="tile">
          <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Date</div>
          <div><div class="big" id="dayNum">00</div><div class="sub"><span id="dayName">&nbsp;</span><br><span id="dayMonth">&nbsp;</span></div></div>
        </div>
      </section>

      <section class="page" id="page1" hidden>
        <div class="tile wide tall">
          <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>This week</div>
          <div class="week" id="week"></div>
        </div>
      </section>
    </div>
  </div>

  <div class="bottom">
    <div class="dots" role="group" aria-label="Pages">
      <button aria-label="Page 1" aria-current="true" data-page="0"></button>
      <button aria-label="Page 2" aria-current="false" data-page="1"></button>
    </div>
    <div class="pills">
      <button class="pill" id="redBtn" aria-pressed="false">Night</button>
      <button class="pill" id="dimBtn">Dim</button>
      <button class="pill icon" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </div>
</div>

<div class="settings" id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <div class="sheet">
    <header>
      <h2 id="settingsTitle">Settings</h2>
      <button id="settingsClose" aria-label="Close settings">&times;</button>
    </header>
    <div class="rows">
      <div class="row"><span class="rl">Clock font</span>
        <div class="seg"><button data-font="dot">Dot</button><button data-font="mono">Mono</button><button data-font="sans">Sans</button></div></div>
      <div class="row"><span class="rl">Accent colour</span>
        <div class="swatches">
          <button data-accent="#d71921" style="--c:#d71921" aria-label="Red"></button>
          <button data-accent="#ffb25b" style="--c:#ffb25b" aria-label="Amber"></button>
          <button data-accent="#5be28c" style="--c:#5be28c" aria-label="Green"></button>
          <button data-accent="#4aa3ff" style="--c:#4aa3ff" aria-label="Blue"></button>
          <button data-accent="#f4f3f0" style="--c:#f4f3f0" aria-label="White"></button>
          <button id="customSwatch" aria-label="Custom colour" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
        </div></div>
      <div class="row custom" id="customRow" hidden>
        <div class="sliders">
          <label>Hue <input type="range" id="hue" min="0" max="360" value="0" aria-label="Hue"></label>
          <label>Saturation <input type="range" id="sat" min="0" max="100" value="100" aria-label="Saturation"></label>
          <label>Lightness <input type="range" id="lig" min="0" max="100" value="50" aria-label="Lightness"></label>
        </div>
        <input type="text" id="customHex" value="#d71921" maxlength="10" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Hex colour code" aria-invalid="false">
      </div>
      <div class="row"><span class="rl">Time format</span>
        <div class="seg"><button data-hour12="false">24-hour</button><button data-hour12="true">12-hour</button></div></div>
      <div class="row"><span class="rl">Week starts on</span>
        <div class="seg"><button data-weekstart="1">Monday</button><button data-weekstart="0">Sunday</button></div></div>
      <div class="row"><span class="rl">Auto-dim at night</span>
        <button class="switch" id="setAuto" role="switch" aria-checked="true" aria-label="Auto-dim at night"></button></div>
      <div class="row"><span class="rl">Dim brightness</span>
        <div class="step"><button id="levelMinus" aria-label="Dimmer">&minus;</button><output id="levelValue">30%</output><button id="levelPlus" aria-label="Brighter">+</button></div></div>
      <div class="row"><span class="rl">Dim from</span>
        <div class="step"><button id="startMinus" aria-label="Start one hour earlier">&minus;</button><output id="startValue">22:00</output><button id="startPlus" aria-label="Start one hour later">+</button></div></div>
      <div class="row"><span class="rl">Dim until</span>
        <div class="step"><button id="endMinus" aria-label="End one hour earlier">&minus;</button><output id="endValue">07:00</output><button id="endPlus" aria-label="End one hour later">+</button></div></div>
    </div>
    <button id="resetSettings">Reset to defaults</button>
  </div>
</div>

<script src="dock-logic.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');

  // ---- settings (stored on the device, validated on load) ----
  const KEY = 'charge-dock-settings';
  let S;
  try { S = DockLogic.normalizeSettings(JSON.parse(localStorage.getItem(KEY))); }
  catch (e) { S = DockLogic.normalizeSettings(null); }
  const saveSettings = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  let manual = null, lastNight = null, dayKey = '', customOpen = false;

  // ---- clock, date, week ----
  function tick() {
    const n = new Date();
    const t = DockLogic.formatTime(n, S.hour12);
    $('time').innerHTML = t.hh + '<span class="colon">:</span>' + t.mm + (t.suffix ? '<span class="ampm">' + t.suffix + '</span>' : '');
    $('date').textContent = n.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const key = n.toDateString();
    if (key !== dayKey) {
      dayKey = key;
      $('dayNum').textContent = pad(n.getDate());
      $('dayName').textContent = n.toLocaleDateString(undefined, { weekday: 'long' });
      $('dayMonth').textContent = n.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
      $('week').innerHTML = DockLogic.weekStrip(n, S.weekStart).map(d =>
        '<div class="' + d.state + '"><span class="wl">' + d.letter + '</span><span class="wn">' + d.name + '</span><b>' + pad(d.day) + '</b></div>').join('');
    }
  }

  // ---- dimming: the schedule decides, the Dim pill overrides until the next boundary ----
  function applyDimming() {
    const night = DockLogic.isNight(new Date(), S.dimStart, S.dimEnd);
    if (night !== lastNight) { lastNight = night; manual = null; }
    const dim = manual !== null ? manual : (S.autoDim && night);
    $('dock').classList.toggle('dim', dim);
    $('dimBtn').textContent = dim ? 'Bright' : 'Dim';
    $('dimBtn').dataset.dim = String(dim);
  }

  // ---- apply settings to the page and the settings screen ----
  function applySettings(fromSlider = false) {
    const root = document.documentElement;
    root.dataset.font = S.font;
    root.dataset.hour12 = String(S.hour12);
    const shown = DockLogic.visibleAccent(S.accent);
    root.style.setProperty('--accent', shown);
    root.style.setProperty('--on-accent', DockLogic.onAccent(shown));
    root.style.setProperty('--dim-opacity', String(S.dimLevel / 100));
    document.body.classList.toggle('red', S.red);
    const mark = (attr, value) => document.querySelectorAll('[data-' + attr + ']').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset[attr] === String(value))));
    mark('font', S.font); mark('accent', S.accent); mark('hour12', S.hour12); mark('weekstart', S.weekStart);
    const preset = DockLogic.ACCENTS.includes(S.accent);
    $('customSwatch').setAttribute('aria-pressed', String(!preset));
    if (preset) { $('customSwatch').style.removeProperty('--c'); $('customSwatch').style.removeProperty('color'); }
    else { $('customSwatch').style.setProperty('--c', S.accent); $('customSwatch').style.color = DockLogic.onAccent(S.accent); }
    $('customRow').hidden = preset && !customOpen;
    const hsl = DockLogic.hexToHsl(S.accent);
    if (!fromSlider) { $('hue').value = hsl.h; $('sat').value = hsl.s; $('lig').value = hsl.l; }
    $('customRow').style.setProperty('--h', $('hue').value);
    $('customRow').style.setProperty('--sp', $('sat').value + '%');
    $('customRow').style.setProperty('--lp', $('lig').value + '%');
    if (document.activeElement !== $('customHex')) $('customHex').value = S.accent;
    $('setAuto').setAttribute('aria-checked', String(S.autoDim));
    $('startValue').textContent = pad(S.dimStart) + ':00';
    $('endValue').textContent = pad(S.dimEnd) + ':00';
    $('levelValue').textContent = S.dimLevel + '%';
    $('redBtn').setAttribute('aria-pressed', String(S.red));
    dayKey = ''; tick(); applyDimming();
  }
  const change = fn => { fn(); saveSettings(); applySettings(); };

  // ---- settings screen ----
  const settings = $('settings');
  const openSettings = () => { settings.hidden = false; $('settingsClose').focus(); };
  const closeSettings = () => { settings.hidden = true; $('settingsBtn').focus(); };
  $('settingsBtn').onclick = openSettings;
  $('settingsClose').onclick = closeSettings;
  const actions = {
    setAuto: () => { S.autoDim = !S.autoDim; manual = null; },
    levelMinus: () => { S.dimLevel = Math.max(10, S.dimLevel - 10); },
    levelPlus: () => { S.dimLevel = Math.min(80, S.dimLevel + 10); },
    startMinus: () => { S.dimStart = (S.dimStart + 23) % 24; },
    startPlus: () => { S.dimStart = (S.dimStart + 1) % 24; },
    endMinus: () => { S.dimEnd = (S.dimEnd + 23) % 24; },
    endPlus: () => { S.dimEnd = (S.dimEnd + 1) % 24; },
    resetSettings: () => { S = DockLogic.normalizeSettings(null); manual = null; customOpen = false; },
    customSwatch: () => { customOpen = true; },
  };
  settings.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.font) change(() => { S.font = d.font; });
    else if (d.accent) change(() => { S.accent = d.accent; customOpen = false; });
    else if (d.hour12) change(() => { S.hour12 = d.hour12 === 'true'; });
    else if (d.weekstart) change(() => { S.weekStart = Number(d.weekstart); });
    else if (actions[b.id]) change(actions[b.id]);
  });

  $('customRow').addEventListener('input', e => {
    if (e.target.type !== 'range') return;
    S.accent = DockLogic.hslToHex(Number($('hue').value), Number($('sat').value), Number($('lig').value));
    saveSettings(); applySettings(true);
  });

  $('customHex').addEventListener('input', () => {
    const hex = DockLogic.parseHexInput($('customHex').value);
    $('customHex').setAttribute('aria-invalid', String(hex === null));
    if (hex === null) return;
    customOpen = true;
    S.accent = hex; saveSettings(); applySettings();
  });
  $('customHex').addEventListener('blur', () => {
    $('customHex').value = S.accent;
    $('customHex').setAttribute('aria-invalid', 'false');
  });

  // ---- quick controls ----
  $('dimBtn').onclick = () => { manual = $('dimBtn').dataset.dim !== 'true'; applyDimming(); };
  const toggleRed = () => change(() => { S.red = !S.red; });
  $('redBtn').onclick = toggleRed;
  document.querySelector('.tile.clock').onclick = toggleRed;

  // ---- pages: dots, arrow keys, swipe ----
  let page = 0;
  function setPage(p) {
    page = Math.max(0, Math.min(1, p));
    $('page0').hidden = page !== 0;
    $('page1').hidden = page !== 1;
    document.querySelectorAll('.dots button').forEach(b => b.setAttribute('aria-current', String(Number(b.dataset.page) === page)));
  }
  document.querySelectorAll('.dots button').forEach(b => { b.onclick = () => setPage(Number(b.dataset.page)); });
  let startX = null;
  $('tiles').addEventListener('pointerdown', e => { startX = e.clientX; });
  $('tiles').addEventListener('pointerup', e => {
    if (startX !== null && Math.abs(e.clientX - startX) > 50) setPage(page + (e.clientX < startX ? 1 : -1));
    startX = null;
  });
  $('tiles').addEventListener('pointercancel', () => { startX = null; });
  addEventListener('keydown', e => {
    if (e.key === 'Escape' && !settings.hidden) closeSettings();
    else if (settings.hidden && e.key === 'ArrowRight') setPage(page + 1);
    else if (settings.hidden && e.key === 'ArrowLeft') setPage(page - 1);
  });

  // ---- battery: the Android app calls window.setBattery(level 0..1 or -1, charging, secondsToFull or -1) ----
  window.setBattery = (level, charging, secsToFull) => {
    const t = DockLogic.batteryText(level, charging, secsToFull);
    const known = Number.isFinite(level) && level >= 0;
    $('pct').textContent = t.pct;
    $('battBig').textContent = t.big;
    $('battSub').textContent = t.sub;
    $('ringFill').style.strokeDashoffset = String(known ? 251.3 * (1 - Math.min(level, 1)) : 251.3);
  };
  window.setBattery(-1, true, -1);

  // ---- keep the screen on (when the browser allows it) ----
  async function keepAwake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }
  keepAwake(); document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

  // ---- burn-in protection: drift the layout a few pixels every 2 minutes ----
  setInterval(() => {
    $('stage').style.transform = 'translate(' + (Math.random() * 8 - 4).toFixed(1) + 'px,' + (Math.random() * 8 - 4).toFixed(1) + 'px)';
  }, 120000);

  applySettings();
  setInterval(tick, 1000);
  setInterval(applyDimming, 5000);
</script>
</body>
</html>
